# Render Blueprint — statische site voor de {A}impact-projectwebsite.
# Bouwt de Vite/React-app en serveert de statische output in dist/.
services:
  - type: web
    name: aimpact-website
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
    headers:
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
